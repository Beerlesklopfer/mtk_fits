<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 – Seite nicht gefunden</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
      :root {
        --bg1: #0f172a; /* slate-900 */
        --bg2: #1f2937; /* gray-800 */
        --accent: #0d6efd; /* bootstrap primary */
      }
      body {
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 10% 10%, rgba(13,110,253,.15), transparent 40%),
                    radial-gradient(1000px 500px at 90% 20%, rgba(13,110,253,.10), transparent 35%),
                    linear-gradient(135deg, var(--bg1), var(--bg2));
        color: #e5e7eb; /* slate-200 */
      }
      .glass {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 10px 30px rgba(0,0,0,.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .error-code {
        font-size: clamp(72px, 12vw, 180px);
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: #ffffff;
        text-shadow: 0 12px 40px rgba(13,110,253,.35);
      }
      .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      }
      a.btn:focus-visible { box-shadow: 0 0 0 .25rem rgba(13,110,253,.35); }
    </style>
  </head>
  <body>
    <main class="container d-flex align-items-center justify-content-center py-5">
      <div class="glass rounded-4 p-4 p-md-5 text-center" style="max-width: 760px; width: 100%;">
        <div class="mb-2">
          <span class="badge rounded-pill text-bg-primary px-3 py-2">Fehler 404</span>
        </div>
        <h1 class="error-code fw-bold mb-3">404</h1>
        <p class="lead mb-4 text-white-50">Ups! Die Seite, die du suchst, existiert nicht oder wurde verschoben.</p>

        <div class="divider my-4"></div>

        <form class="row g-2 justify-content-center" role="search" onsubmit="return handleSearch(event)">
          <div class="col-12 col-md-8">
            <input id="searchInput" class="form-control form-control-lg" type="search" placeholder="Suche auf der Website" aria-label="Suche" />
          </div>
          <div class="col-12 col-md-auto">
            <button class="btn btn-primary btn-lg w-100" type="submit">Suchen</button>
          </div>
        </form>

        <div class="d-flex flex-column flex-md-row gap-2 justify-content-center mt-4">
          <a href="/" class="btn btn-outline-light btn-lg"><i class="bi bi-house"></i> Zur Startseite</a>
          <a href="javascript:history.back()" class="btn btn-light btn-lg">Zurück</a>
          <a href="mailto:support@example.com" class="btn btn-outline-light btn-lg">Support kontaktieren</a>
        </div>

        <p class="small text-white-50 mt-4 mb-0">Fehlercode: 404_NOT_FOUND</p>
      </div>
    </main>

    <!-- Optional Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Bootstrap JS (optional, for components that need JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
      // Simple on-page search redirect (adjust target as needed)
      function handleSearch(e) {
        e.preventDefault();
        const q = document.getElementById('searchInput').value.trim();
        if (!q) return false;
        // Beispiel: interne Suche oder externe Engine
        // window.location.href = `/suche?q=${encodeURIComponent(q)}`;
        window.location.href = `https://www.google.com/search?q=site:${location.hostname}+${encodeURIComponent(q)}`;
        return false;
      }
    </script>
  </body>
</html>
